name: Build Mod & Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Fabric Mod JAR
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: novaimod-1.0.0
          path: build/libs/novaimod-1.0.0.jar

      - name: Create or Update GitHub Release with JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/libs/novaimod-1.0.0.jar --clobber
          else
            gh release create v1.0.0 build/libs/novaimod-1.0.0.jar \
              --target "${{ github.sha }}" \
              --title "Novai Mod v1.0.0 (Minecraft 1.21.1 Fabric)" \
              --notes "Готовый файл мода **novaimod-1.0.0.jar** для **Minecraft 1.21.1 (Fabric + Fabric API)**. Скачайте `.jar` ниже и положите в папку `.minecraft/mods` вместе с Fabric API."
          fi

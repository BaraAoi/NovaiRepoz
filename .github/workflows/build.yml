name: Build Mod & Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Read Mod Version
        id: meta
        run: |
          MOD_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r ')
          echo "version=${MOD_VER}" >> "$GITHUB_OUTPUT"
          echo "jar_path=build/libs/novaimod-${MOD_VER}.jar" >> "$GITHUB_OUTPUT"

      - name: Build Fabric Mod JAR
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --no-daemon --stacktrace > build_out.log 2>&1
          CODE=$?
          cat build_out.log
          if [ $CODE -ne 0 ]; then
            MSG=$(grep -A 3 -E "error:|FAILED" build_out.log | head -n 60 | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '|' )
            echo "::error title=GradleBuildError::${MSG}"
            TAIL_MSG=$(tail -n 40 build_out.log | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '|')
            echo "::error title=GradleBuildTail::${TAIL_MSG}"
            exit $CODE
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: novaimod-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.jar_path }}

      - name: Create or Update GitHub Release with JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.meta.outputs.version }}
          JAR: ${{ steps.meta.outputs.jar_path }}
        run: |
          TAG="v${VER}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${JAR}" --clobber
          else
            gh release create "${TAG}" "${JAR}" \
              --target "${{ github.sha }}" \
              --title "Novai Mod v${VER} (Minecraft 1.21.1 Fabric)" \
              --notes "Готовый файл мода **novaimod-${VER}.jar** для **Minecraft 1.21.1 (Fabric + Fabric API)**. Скачайте файл ниже и положите в папку `.minecraft/mods` вместе с Fabric API."
          fi
